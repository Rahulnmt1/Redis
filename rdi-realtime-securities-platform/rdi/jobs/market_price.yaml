# =====================================================================
# RDI Job: portfolio.market_price  ->  Redis Hash
# Key pattern:  price:{security_id}
#
# Hot path. Updated every few seconds during market hours by the
# upstream OMS / market-data feed. RDI mirrors it to Redis Enterprise
# so the broker's app can compute live P&L without touching Oracle.
# =====================================================================
source:
  server_name: sectrade
  schema: portfolio
  table: market_price

output:
  - uses: redis.write
    with:
      connection: target
      data_type: hash
      key:
        expression: concat(['price:', to_string(security_id)])
        language: jmespath
