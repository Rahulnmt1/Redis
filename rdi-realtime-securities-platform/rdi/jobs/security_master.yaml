# =====================================================================
# RDI Job: portfolio.security_master  ->  Redis (two shapes, one source)
#
# This single YAML drives TWO cache shapes off ONE source table — the
# canonical RDI multi-shape fan-out story (two writes, one target BDB):
#
#   1) security:{symbol}        HASH  - existing trading-screen quote
#                                       lookup (HGET <field>). Filtered
#                                       to is_active = true.
#   2) security_full:{security_id}  JSON  - full instrument document for
#                                       agents / OMS pre-trade gates /
#                                       advisory copilots that need
#                                       fields like is_active and
#                                       corporate_action_flag even when
#                                       the trading screen shouldn't
#                                       list the symbol.
# =====================================================================
source:
  server_name: sectrade
  schema: portfolio
  table: security_master

output:
  # ---- shape #1 -----------------------------------------------------
  # Quote-lookup HASH keyed by symbol. Stays filtered so that the
  # customer-facing search doesn't surface SUSPENDED instruments.
  - uses: redis.write
    with:
      connection: target
      data_type: hash
      filter:
        expression: is_active == `true`
        language:   jmespath
      key:
        expression: concat(['security:', symbol])
        language: jmespath

  # ---- shape #2 -----------------------------------------------------
  # Full instrument JSON keyed by security_id. UNfiltered so OMS pre-
  # trade gates and AI agents can read is_active / corporate_action_flag
  # even for SUSPENDED rows (otherwise we'd have no value to inspect).
  - uses: redis.write
    with:
      connection: target
      data_type: json
      key:
        expression: concat(['security_full:', to_string(security_id)])
        language: jmespath
      args:
        path: $
