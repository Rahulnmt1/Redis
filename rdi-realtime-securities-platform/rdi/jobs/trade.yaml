# =====================================================================
# RDI Job: portfolio.trade  ->  Redis Stream  +  Redis JSON
#
# Two outputs from the SAME source event - showcases RDI's fan-out:
#   1) Append to a per-customer stream so the "My Orders" screen and
#      downstream consumers (risk, P&L, regulatory) get a live feed.
#   2) Latest-trade JSON for fast point-lookup by trade_id.
# =====================================================================
source:
  server_name: hdfcsec
  schema: portfolio
  table: trade

output:
  - uses: redis.write
    with:
      connection: target
      data_type: stream
      key:
        expression: concat(['trades:', to_string(customer_id)])
        language: jmespath

  - uses: redis.write
    with:
      connection: target
      data_type: json
      key:
        expression: concat(['trade:', to_string(trade_id)])
        language: jmespath
