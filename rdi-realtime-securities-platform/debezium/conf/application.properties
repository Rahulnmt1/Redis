# =====================================================================
# Debezium Server (Postgres source -> Redis Streams sink)
#
# NOTE TO REVIEWER: This is the same CDC engine that ships INSIDE RDI's
# collector. In a real RDI deployment, Redis bundles, manages, monitors
# and supports this for you - you only edit `config.yaml`.
# We expose the raw config here purely for demo transparency.
# =====================================================================

# ---------- General ----------
debezium.format.value=json
debezium.format.key=json
debezium.format.value.schemas.enable=false
debezium.format.key.schemas.enable=false

# ---------------------------------------------------------------------
# Low-latency tuning for the architect demo
# ---------------------------------------------------------------------
# Debezium's Quarkus poll thread drains the internal record queue every
# `poll.interval.ms`. The connector default is 500 ms — designed for
# production back-pressure, not for a same-host demo. We push it down
# to 1 ms here: on a Docker bridge with sub-ms inter-container latency,
# this gets CDC pickup (PG INSERT → Debezium → rdi-state stream entry)
# into the single-digit / sub-ms band that the architect demo expects.
debezium.source.poll.interval.ms=1
# Match the queue / batch sizes to that cadence: don't sit waiting for
# a 2048-event batch when we're firing single events from the dashboard.
debezium.source.max.batch.size=64
debezium.source.max.queue.size=1024
# Same idea on the Redis sink — flush early instead of waiting for a
# 500-record pipeline batch.
debezium.sink.redis.batch.size=16

# ---------- Sink: Redis Streams on the RDI database ----------
debezium.sink.type=redis
debezium.sink.redis.address=redis-rdi:12001
# No AUTH on the RDI state DB in this demo; leave user/password unset
# In production, RDI injects these from its secrets store.

# (Optional) memory back-pressure - identical to RDI defaults
debezium.sink.redis.memory.limit.mb=300
debezium.sink.redis.memory.threshold.percentage=85

# ---------- Source: PostgreSQL (HDFC Sec portfolio system of record) -
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.offset.storage=io.debezium.server.redis.RedisOffsetBackingStore
debezium.source.offset.storage.redis.address=redis-rdi:12001
debezium.source.schema.history.internal=io.debezium.server.redis.RedisSchemaHistory
debezium.source.schema.history.internal.redis.address=redis-rdi:12001

debezium.source.topic.prefix=hdfcsec
debezium.source.database.hostname=postgres
debezium.source.database.port=5432
debezium.source.database.user=rdi_cdc_user
debezium.source.database.password=rdi_cdc_pwd
debezium.source.database.dbname=hdfcsec
debezium.source.plugin.name=pgoutput
debezium.source.publication.name=rdi_publication
debezium.source.publication.autocreate.mode=filtered
debezium.source.slot.name=rdi_slot

# Capture all five portfolio tables
debezium.source.table.include.list=portfolio.customer,portfolio.security_master,portfolio.holding,portfolio.trade,portfolio.market_price

# Snapshot first, then stream CDC - exact RDI behaviour.
# For the architect-demo dataset (3M rows pre-loaded directly by the
# bulk seeder so we never wait for an initial CDC pass), we set
# snapshot.mode=no_data: Debezium reads the schema only and resumes
# streaming from the current WAL position. The initial copy of the
# rows already lives in the target cache via the bulk seeder, so a
# CDC snapshot would just re-emit 3M rows we don't need.
# RDI offers the same option via `sources.<name>.advanced.source.snapshot.mode`.
debezium.source.snapshot.mode=never

# Send NUMERIC/DECIMAL columns as plain doubles (default = base64 precise).
# This is what RDI sets when the pipeline target is JSON/Hash.
debezium.source.decimal.handling.mode=double

# Send DATE / TIMESTAMP columns as millisecond epoch values that downstream
# code can format trivially (default = adaptive_microseconds which mixes types).
debezium.source.time.precision.mode=connect

# Reduce noise
quarkus.log.console.json=false
quarkus.log.level=INFO
